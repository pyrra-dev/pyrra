name: Go
on:
  pull_request:
  push:
    branches:
      - 'release-*'
      - 'main'
    tags:
      - 'v*'
env:
  golang-version: '1.17'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  go:
    runs-on: ubuntu-latest
    name: Go
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
      - run: mkdir -p ui/build && touch ui/build/empty
      - run: make test
      - run: make pyrra

  rules:
    runs-on: ubuntu-latest
    name: Generated rule behavior
    env:
      # Keep in sync with github.com/prometheus/prometheus v0.315.0 in go.mod.
      PROMETHEUS_VERSION: '3.15.0'
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
      - name: Install matching promtool release
        shell: bash
        run: |
          set -euo pipefail
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          url="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$url/$archive" -o "$archive"
          curl --fail --location --retry 3 "$url/sha256sums.txt" -o sha256sums.txt
          grep " ${archive}$" sha256sums.txt | sha256sum --check --strict
          tar -xzf "$archive" "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          echo "$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64" >> "$GITHUB_PATH"
      - run: mkdir -p ui/build && touch ui/build/empty
      - name: Check rule goldens, then run promtool suites
        run: |
          promtool --version
          make test-rules
