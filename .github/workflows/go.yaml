name: Go
on:
  pull_request:
  push:
    branches:
      - 'release-*'
      - 'main'
    tags:
      - 'v*'
permissions:
  contents: read

env:
  golang-version: '1.17'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  go:
    runs-on: ubuntu-latest
    name: Go
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Go caching is acceptable here because this workflow has a read-only
      # token, uses no secrets and publishes nothing.
      - name: Install Go # zizmor: ignore[cache-poisoning]
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
      - run: make test
      - run: make pyrra

  rules:
    runs-on: ubuntu-latest
    name: Generated rule behavior
    env:
      # Keep in sync with github.com/prometheus/prometheus v0.315.0 in go.mod.
      PROMETHEUS_VERSION: '3.15.0'
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
      - name: Install matching promtool release
        shell: bash
        run: |
          set -euo pipefail
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          url="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$url/$archive" -o "$archive"
          curl --fail --location --retry 3 "$url/sha256sums.txt" -o sha256sums.txt
          grep " ${archive}$" sha256sums.txt | sha256sum --check --strict
          tar -xzf "$archive" "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          echo "$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64" >> "$GITHUB_PATH"
      - run: mkdir -p ui/build && touch ui/build/empty
      - name: Check rule goldens, then run promtool suites
        run: |
          promtool --version
          make test-rules
