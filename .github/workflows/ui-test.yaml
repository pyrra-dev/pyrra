name: ui-test
on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          # renovate: datasource=node-version depName=node versioning=node allowedVersions=^22
          - 22.x
          # renovate: datasource=node-version depName=node versioning=node
          - 24.x

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
        working-directory: ./ui
      - run: npm run lint
        working-directory: ./ui
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          # renovate: datasource=node-version depName=node versioning=node allowedVersions=^22
          - 22.x
          # renovate: datasource=node-version depName=node versioning=node
          - 24.x

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
        working-directory: ./ui
      - run: npm run check:crd-types
        working-directory: ./ui
      - run: npm run test
        working-directory: ./ui

